.build_template:
  stage: build
  extends:
    - .after_script:build
  image: $ESP_ENV_IMAGE
  tags: [build, shiny]
  variables:
    # Enable ccache for all build jobs. See configure_ci_environment.sh for more ccache related settings.
    IDF_CCACHE_ENABLE: "1"
  dependencies: # set dependencies to null to avoid missing artifacts issue

####################
# Dynamic Pipeline #
####################
# Generate GCC, Clang and buildv2 separately so only the standard GCC pipeline
# includes the additional jobs which compare the app sizes.
generate_build_child_pipeline:
  needs:
    - pipeline_variables
    - job: pre_check_complete
      artifacts: false
    - job: baseline_manifest_sha
      optional: true
  artifacts:
    paths:
      - build_child_pipeline.yml
      - test_related_apps.txt
      - non_test_related_apps.txt
      - build_child_pipeline_clang.yml
      - test_related_apps_clang.txt
      - non_test_related_apps_clang.txt
      - buildv2_child_pipeline.yml
      - test_related_apps_buildv2.txt
      - non_test_related_apps_buildv2.txt
    expire_in: 1 week
    when: always
  script:
    - idf-ci --debug --config "gitlab.build_enabled_toolchains=['gcc']"
      --config "gitlab.test_enabled_toolchains=['gcc']"
      --config "gitlab.build_pipeline.additional_include_yaml_files=['.gitlab/ci/common.yml','tools/ci/dynamic_pipelines/templates/.dynamic_jobs.yml','tools/ci/dynamic_pipelines/templates/additional_jobs.yml']"
      gitlab build-child-pipeline
      -p components
      -p examples
      -p tools/test_apps
    - idf-ci --debug --config "gitlab.build_enabled_toolchains=['clang']"
      --config "gitlab.test_enabled_toolchains=['clang']"
      gitlab build-child-pipeline
      -p components
      -p examples
      -p tools/test_apps
    - shuf test_related_apps.txt -o test_related_apps.txt
    - shuf non_test_related_apps.txt -o non_test_related_apps.txt
    - shuf test_related_apps_clang.txt -o test_related_apps_clang.txt
    - shuf non_test_related_apps_clang.txt -o non_test_related_apps_clang.txt
    # Discover the buildv2 apps under the same condition as .if-label-buildv2 in rules.yml.
    # Manifest rules read IDF_BUILD_V2 during app discovery.
    - |
      if [ -n "${BOT_LABEL_BUILDV2:-}" ] || echo ",${CI_MERGE_REQUEST_LABELS:-}," | grep -qi ',buildv2,'; then
        IDF_BUILD_V2=1 IDF_CI_ARTIFACT_NAMESPACE=buildv2 idf-ci --debug \
          --config "gitlab.build_enabled_toolchains=['gcc']" \
          --config "gitlab.test_enabled_toolchains=['gcc']" \
          gitlab build-child-pipeline \
          -p components \
          -p examples \
          -p tools/test_apps \
          buildv2_child_pipeline.yml
        shuf test_related_apps_buildv2.txt -o test_related_apps_buildv2.txt
        shuf non_test_related_apps_buildv2.txt -o non_test_related_apps_buildv2.txt
      fi

build_child_pipeline_clang:
  stage: build
  needs:
    - job: fast_build_check
      optional: true
      artifacts: false
    - pipeline_variables
    - generate_build_child_pipeline
    - job: pre_check_complete
      artifacts: false
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    IDF_TOOLCHAIN: clang
    IDF_CI_ARTIFACT_NAMESPACE: clang
  inherit:
    variables: false
  trigger:
    include:
      - artifact: build_child_pipeline_clang.yml
        job: generate_build_child_pipeline
    strategy: depend

build_child_pipeline_buildv2:
  stage: build
  extends:
    - .rules:labels:buildv2
  needs:
    - job: fast_build_check
      optional: true
      artifacts: false
    - pipeline_variables
    - generate_build_child_pipeline
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    IDF_BUILD_V2: "1"
    IDF_CI_ARTIFACT_NAMESPACE: buildv2
  inherit:
    variables: false
  trigger:
    include:
      - artifact: buildv2_child_pipeline.yml
        job: generate_build_child_pipeline
    strategy: depend
  allow_failure: true
