# pre_check stage
clang_tidy_check:
  extends:
    - .pre_check_template
    - .rules:patterns:clang_tidy
  artifacts:
    paths:
      - clang_tidy_reports/
    expire_in: 1 week
    when: always
  variables:
    IDF_TOOLCHAIN: clang
  script:
    - run_cmd idf_clang_tidy $(cat tools/ci/clang_tidy_dirs.txt | xargs)
      --output-path clang_tidy_reports
      --limit-file tools/ci/static-analysis-rules.yml
      --xtensa-include-dir
