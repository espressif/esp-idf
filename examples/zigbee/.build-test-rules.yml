# Documentation: .gitlab/ci/README.md#manifest-file-to-control-the-buildtest-apps

.zigbee_dependencies: &zigbee_dependencies
  depends_components:
    - ieee802154
    - openthread
    - protocol_examples_common
  depends_filepatterns:
    - examples/zigbee/esp_zigbee_gateway/*
    - examples/zigbee/light_sample/**/*

examples/zigbee/esp_zigbee_gateway:
  enable:
    - if: (SOC_WIFI_SUPPORTED == 1 and IDF_TARGET not in ["esp32c61", "esp32c2"]) or IDF_TARGET in ["esp32p4"]
  disable_test:
    - if: IDF_TARGET not in ["esp32s3"]
      reason: only test on esp32s3
  <<: *zigbee_dependencies

examples/zigbee/light_sample:
  enable:
    - if: SOC_IEEE802154_SUPPORTED == 1
  disable_test:
    - if: IDF_TARGET not in ["esp32h2"]
      temporary: true
      reason: only test on esp32h2
  <<: *zigbee_dependencies
