# Documentation: .gitlab/ci/README.md#manifest-file-to-control-the-buildtest-apps

components/esp_hw_support/test_apps/cpu:
  depends_components:
    - esp_hw_support
    - riscv
    - xtensa
    - soc

components/esp_hw_support/test_apps/esp_hw_support_unity_tests:
  disable:
    - if: CONFIG_NAME == "pvt" and SOC_PMU_PVT_SUPPORTED != 1
  disable_test:
    - if: IDF_TARGET == "esp32h21" # TODO: IDF-16199
      temporary: true
      reason: cannot pass
  depends_components:
    - esp_driver_gpio
    - esp_hal_gpio
    - esp_hal_wdt
    - esp_hw_support
    - esp_pm
    - esp_sleep
    - soc
    - xtensa

components/esp_hw_support/test_apps/host_test_linux:
  enable:
    - if: IDF_TARGET == "linux"
  depends_components:
    - esp_hw_support

components/esp_hw_support/test_apps/mspi_psram_with_dfs:
  depends_components:
    - esp_hw_support
    - esp_sleep
    - spi_flash
    - esp_partition
    - esp_pm
    - soc
  disable:
    - if: IDF_TARGET != "esp32s3"

components/esp_hw_support/test_apps/rtc_8md256:
  depends_components:
    - esp_hw_support
    - esp_sleep
    - soc
  disable:
    - if: SOC_RTC_SLOW_CLK_SUPPORT_RC_FAST_D256 != 1

components/esp_hw_support/test_apps/rtc_clk:
  depends_components:
    - esp_driver_gpio
    - esp_hal_gpio
    - esp_hw_support
    - esp_sleep
    - soc
  disable:
    - if: SOC_CLK_TREE_SUPPORTED != 1

components/esp_hw_support/test_apps/usb_phy:
  enable:
    - if: SOC_USB_OTG_SUPPORTED == 1
  depends_components:
    - esp_hw_support
    - soc
  depends_filepatterns:
    - components/hal/usb*.c
    - components/hal/include/hal/usb*.h
    - components/hal/esp32*/include/hal/usb*.h
    - components/soc/esp32*/usb*.c
    - components/soc/include/soc/usb*.h
    - components/soc/esp32*/include/soc/usb_dwc_*.h
    - components/soc/esp32*/include/soc/usb_wrap_*.h
    - components/esp_hw_support/**/usb_phy.*
