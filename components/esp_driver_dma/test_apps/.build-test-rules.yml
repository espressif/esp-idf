# Documentation: .gitlab/ci/README.md#manifest-file-to-control-the-buildtest-apps

components/esp_driver_dma/test_apps/dma:
  disable:
    - if: SOC_GDMA_SUPPORTED != 1 and SOC_CP_DMA_SUPPORTED != 1
    - if: CONFIG_NAME == "flash_enc" and SOC_FLASH_ENC_SUPPORTED != 1
    - if: CONFIG_NAME == "weighted_arbitration" and SOC_GDMA_SUPPORT_WEIGHTED_ARBITRATION != 1
  depends_components:
    - esp_driver_dma
    - esp_hal_dma
    - esp_hw_support
    - esp_sleep
    - soc

components/esp_driver_dma/test_apps/dma2d:
  disable:
    - if: SOC_DMA2D_SUPPORTED != 1
  depends_components:
    - esp_driver_dma
    - esp_hal_dma
    - esp_hw_support
    - soc
