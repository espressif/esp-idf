# Documentation: .gitlab/ci/README.md#manifest-file-to-control-the-buildtest-apps

components/esp_event/test_apps:
  enable:
    - if: IDF_TARGET in ["esp32", "esp32s2", "esp32c3", "linux"]
      reason: covers all major arch types, xtensa vs riscv, single vs dual-core
  disable:
    - if: IDF_TARGET != "esp32" and CONFIG_NAME in ["ext_ram", "ext_ram_no_iram", "psram_caps"]
      reason: it is enough to test PSRAM configs on esp32
  depends_components:
    - esp_event
