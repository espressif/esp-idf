# Documentation: .gitlab/ci/README.md#manifest-file-to-control-the-buildtest-apps

tools/test_apps/size_metrics/minimal_baseline:
  disable:
    - if: IDF_TARGET == "linux" and CONFIG_NAME == "pm"
      reason: Power management is not supported on linux
    - if: CONFIG_NAME == "pm_pd" and SOC_PM_SUPPORT_TOP_PD != 1
      reason: Only targets that can power down the TOP domain build pm_pd
  disable_test:
    - if: IDF_TARGET == "linux"
      temporary: true
      reason: Not a real hardware target

tools/test_apps/size_metrics/wifi_ota:
  disable:
    - if: SOC_WIFI_SUPPORTED != 1
      reason: Wi-Fi is not supported
    - if: CONFIG_NAME == "pm_pd" and SOC_PM_SUPPORT_TOP_PD != 1
      reason: Only targets that can power down the TOP domain build pm_pd
